status:
  scope: >-
    Auxiliary Lean 4 and Mathlib verification of the nontrivial local
    strength-3 covering-array obstruction (no four distinct four-bit rows
    cover all binary pairs), the explicit five-row local witness, and the
    arithmetic aggregation across nine mandatory classes. The exact local
    minima 2,5,8,16 are exhaustively checked by the independent Python and C++
    verifiers; the full INDUSTRIAL_8 parser, class decomposition, and witness
    coverage theorem are not claimed Lean-formalized.
  sorry_count: 0
  sorry_in_definitions: 0
  notes: >-
    This is a partial formalization of a load-bearing lower-bound subproblem,
    not a Lean formalization of the complete R003 theorem.
  axioms: []
  main_results:
    - declaration: "R003.pairwiseFourRowObstruction"
      file: "R003/LocalCovering.lean"
      sorry_count: 0
      axioms: []
    - declaration: "R003.pairwiseFiveRowWitness"
      file: "R003/LocalCovering.lean"
      sorry_count: 0
      axioms: []
    - declaration: "R003.nineClassSumLower"
      file: "R003/LocalCovering.lean"
      sorry_count: 0
      axioms: []

automation:
  methods:
    - method: "agent"
      models:
        - "GPT-5.6 Sol"
      framework: "OpenAI"
      tool_setup: >-
        Used to implement and debug the public auxiliary formalization and
        verification engineering. Final claims are accepted only after the
        pinned Lean kernel build and independent exact replays succeed.
  notes: >-
    This is an AI-generated public research artifact maintained by Unsolved
    Labs. No conventional human authorship is implied.

fidelity:
  divergences: >-
    Lean checks the four-row pairwise obstruction, the five-row pairwise
    witness, and nine-class arithmetic aggregation. The exact minima 2,5,8,16,
    benchmark-text semantics, proof that the frozen model has nine mandatory
    classes, and complete witness coverage are checked by the independent
    exact Python and C++ verification paths rather than represented inside Lean.

review:
  status: "hybrid-machine-verified"
  reviewers: []
  notes: >-
    No independent specialist peer review is claimed. Machine verification
    consists of pinned Lean checking of the auxiliary pairwise obstruction and
    aggregation theorem plus two independent exact replays of the complete
    frozen-model claim.

alignment:
  statements:
    - source: "Manuscript Lemma: four rows cannot cover all binary pairs"
      lean: "R003.pairwiseFourRowObstruction"
